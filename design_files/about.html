<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazecca Numismática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=11">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png?v=11">
  <link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180.png?v=11">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png?v=11">
  <link rel="shortcut icon" href="assets/favicon-48.png?v=11">
  <style>
    .about-hero {
      display: grid;
      grid-template-columns: minmax(340px, 440px) 1fr;
      gap: 56px;
      padding: 72px 0 80px;
      align-items: center;
    }
    @media (max-width: 900px) {
      .about-hero {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 48px 0;
        justify-items: center;
        text-align: center;
      }
      .about-hero .signature-block { text-align: left; }
    }

    .about-portrait {
      aspect-ratio: 3/4;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--cream);
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .about-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .about-portrait::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(201,169,97,0.4);
      border-radius: calc(var(--radius-lg) - 6px);
      pointer-events: none;
    }
    .about-hero-copy {
      max-width: 620px;
    }
    .about-hero h1 {
      font-size: clamp(34px, 3.6vw, 54px);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--burgundy-900);
      margin: 14px 0 22px;
    }
    .about-hero h1 em { font-style: italic; color: var(--gold-800); }
    .about-hero p { font-size: 16px; line-height: 1.7; }
    .about-hero .lede { font-size: 19px; }
    .signature-block {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .signature-block .signature {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--burgundy-800);
      font-style: italic;
      line-height: 1;
    }
    .signature-block .signature-role {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-top: 6px;
    }

    /* Timeline */
    .timeline {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: var(--gold-700);
    }
    .timeline-item {
      display: grid;
      grid-template-columns: 40px 100px 1fr;
      gap: 24px;
      padding: 24px 0;
      align-items: start;
    }
    .timeline-item .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--gold-700);
      border: 3px solid var(--paper);
      box-shadow: 0 0 0 3px var(--gold-700);
      margin: 4px 14px;
    }
    .timeline-item .year {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--burgundy-800);
      line-height: 1;
    }
    .timeline-item h4 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--ink-950);
      margin-bottom: 8px;
    }
    .timeline-item p {
      color: var(--ink-700);
      font-size: 15px;
      line-height: 1.65;
    }

    /* Values */
    .values-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    @media (max-width: 900px) { .values-grid { grid-template-columns: 1fr; } }
    .value-card {
      padding: 40px 32px;
      background: var(--paper-soft);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .value-card .v-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--burgundy-700);
      color: var(--gold-500);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .value-card h3 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--burgundy-900);
      margin-bottom: 12px;
    }
    .value-card p { color: var(--ink-700); line-height: 1.65; }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      padding: 48px 0;
      background: var(--burgundy-900);
      color: var(--cream);
      border-radius: var(--radius-lg);
      margin: 48px 0;
      text-align: center;
    }
    @media (max-width: 720px) { .stats-strip { grid-template-columns: 1fr 1fr; gap: 24px; } }
    .stats-strip .num {
      font-family: var(--font-display);
      font-size: 52px;
      color: var(--gold-500);
      line-height: 1;
    }
    .stats-strip .lbl {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--parchment);
      margin-top: 10px;
    }
    .stats-strip .divider {
      border-left: 1px solid rgba(201,169,97,0.25);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    @media (max-width: 900px) { .team-grid { grid-template-columns: 1fr; } }
    .team-card {
      background: var(--paper-soft);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .team-card .team-avatar {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--cream), var(--parchment));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--burgundy-700);
      font-family: var(--font-display);
      font-size: 56px;
    }
    .team-card .team-body { padding: 24px; }
    .team-card .team-name {
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--ink-950);
      margin-bottom: 4px;
    }
    .team-card .team-role {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-800);
      margin-bottom: 12px;
    }
    .team-card .team-bio { font-size: 14px; color: var(--ink-500); line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app" data-screen-label="06 Sobre"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="js/data.js?v=11"></script>
  <script type="text/babel" src="js/components.jsx?v=11"></script>

  <script type="text/babel">
    const About = () => (
      <>
        <Header page="about" />

        {/* Hero */}
        <section className="container">
          <div className="about-hero">
            <div>
              <div className="about-portrait">
                <img src="assets/dr-sergio-portrait.png" alt="Dr. Sergio Costa" />
              </div>
            </div>
            <div className="about-hero-copy">
              <span className="eyebrow">Nossa História · Desde 1998</span>
              <h1>De um pequeno acervo particular ao maior <em>caderno de curadoria</em> numismática do Brasil.</h1>
              <p className="lede" style={{maxWidth:'none', margin:0}}>
                A La Zecca nasceu na sala de casa. Um único armário de vidro, três dezenas de moedas herdadas do avô e a promessa de nunca vender uma peça sem antes conhecê-la a fundo.
              </p>
              <p style={{marginTop:16, color:'var(--ink-700)'}}>
                Vinte e sete anos depois, esse compromisso permanece. Hoje somos uma equipe pequena, obstinada, que atende colecionadores em todo o Brasil e mantém, na Rua do Pocinho, no Centro de Fortaleza, uma sala aberta a quem quiser conversar sobre uma peça em particular.
              </p>
              <div className="signature-block">
                <div className="signature">Dr. Sergio Costa</div>
                <div className="signature-role">Fundador · Curador-Chefe</div>
              </div>
            </div>
          </div>
        </section>

        {/* Stats */}
        <div className="container">
          <div className="stats-strip">
            <div><div className="num">27</div><div className="lbl">Anos de Ofício</div></div>
            <div className="divider"><div className="num">2.400+</div><div className="lbl">Peças Curadas</div></div>
            <div className="divider"><div className="num">1.200+</div><div className="lbl">Colecionadores</div></div>
            <div className="divider"><div className="num">4,9★</div><div className="lbl">Nossa Avaliação</div></div>
          </div>
        </div>

        {/* Manifesto */}
        <section className="bg-cream">
          <div className="container-narrow" style={{textAlign:'center'}}>
            <span className="eyebrow">Nosso Manifesto</span>
            <h2 className="h1" style={{marginTop: 12, marginBottom: 32}}>Colecionar é preservar.</h2>
            <p style={{fontFamily:'var(--font-serif)', fontSize:22, fontStyle:'italic', lineHeight:1.6, color:'var(--ink-700)', maxWidth:720, margin:'0 auto'}}>
              Cada moeda que atravessou séculos escapou de fundições, guerras, esquecimentos. Chegar ao presente é, para uma peça, um pequeno milagre. Cuidar dela é uma responsabilidade — e um privilégio.
            </p>
            <p style={{fontFamily:'var(--font-serif)', fontSize:20, lineHeight:1.7, color:'var(--ink-700)', marginTop: 24, maxWidth:640, margin:'24px auto 0'}}>
              Não somos apenas uma loja. Somos uma comunidade de guardiões temporários dessas pequenas obras de arte utilitária. Aqui, cada peça é apresentada com contexto histórico, atribuição rigorosa e o cuidado que 500 anos de história merecem.
            </p>
          </div>
        </section>

        {/* Timeline */}
        <section>
          <div className="container">
            <div className="section-head" style={{justifyContent:'center', textAlign:'center'}}>
              <div className="section-title">
                <span className="eyebrow">Nossa Trajetória</span>
                <h2 className="h2">Cinco décadas em cinco marcos</h2>
              </div>
            </div>
            <div className="timeline">
              <div className="timeline-item">
                <span className="dot"></span>
                <span className="year">1998</span>
                <div>
                  <h4>Uma sala, um armário, uma paixão</h4>
                  <p>Dr. Sergio Costa organiza o acervo herdado do avô e inicia trocas com colecionadores locais. Nasce, informalmente, a La Zecca.</p>
                </div>
              </div>
              <div className="timeline-item">
                <span className="dot"></span>
                <span className="year">2004</span>
                <div>
                  <h4>Primeira loja física em Fortaleza</h4>
                  <p>Abertura do escritório de curadoria na Rua do Pocinho, no Centro Histórico da capital cearense. Consultoria para colecionadores privados começa a se estruturar.</p>
                </div>
              </div>
              <div className="timeline-item">
                <span className="dot"></span>
                <span className="year">2011</span>
                <div>
                  <h4>Parceria com a Sociedade Numismática Brasileira</h4>
                  <p>Passamos a integrar o comitê de autenticação. Iniciamos a emissão dos certificados La Zecca, hoje reconhecidos em todo o país.</p>
                </div>
              </div>
              <div className="timeline-item">
                <span className="dot"></span>
                <span className="year">2019</span>
                <div>
                  <h4>Lazecca.com.br vai ao ar</h4>
                  <p>A loja virtual atende, no primeiro ano, colecionadores em 22 estados. O canal digital preserva o rigor curatorial do atendimento presencial.</p>
                </div>
              </div>
              <div className="timeline-item">
                <span className="dot"></span>
                <span className="year">2026</span>
                <div>
                  <h4>Nova identidade, mesma essência</h4>
                  <p>Renovamos nosso emblema e nosso diário digital, reafirmando o compromisso com a curadoria e a educação numismática.</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* Valores */}
        <section className="bg-cream">
          <div className="container">
            <div className="section-head" style={{justifyContent:'center', textAlign:'center'}}>
              <div className="section-title">
                <span className="eyebrow">O que nos guia</span>
                <h2 className="h2">Três princípios inegociáveis</h2>
              </div>
            </div>
            <div className="values-grid">
              <div className="value-card">
                <div className="v-icon"><Icon name="shield" size={30}/></div>
                <h3>Autenticidade Absoluta</h3>
                <p>Toda peça é examinada, pesada, medida e cruzada com catálogos internacionais. Emitimos certificado próprio e recomendamos análise externa quando necessário.</p>
              </div>
              <div className="value-card">
                <div className="v-icon"><Icon name="award" size={30}/></div>
                <h3>Curadoria Ativa</h3>
                <p>Rejeitamos mais peças do que aceitamos. Nossa reputação depende do que decidimos não colocar no acervo — e cada exemplar recebe uma pequena ficha de história.</p>
              </div>
              <div className="value-card">
                <div className="v-icon"><Icon name="sparkles" size={30}/></div>
                <h3>Educação Numismática</h3>
                <p>Colecionar bem depende de saber. Publicamos guias, respondemos dúvidas por escrito, e conversamos com paciência com quem está começando.</p>
              </div>
            </div>
          </div>
        </section>



        {/* CTA */}
        <section className="bg-burgundy" style={{textAlign:'center'}}>
          <div className="container-narrow">
            <span className="eyebrow" style={{color:'var(--gold-600)'}}>Vender ou avaliar sua coleção</span>
            <h2 className="h2" style={{color:'var(--gold-500)', marginTop:12, marginBottom:16}}>Recebemos peças em consignação</h2>
            <p style={{color:'var(--parchment)', fontSize:18, lineHeight:1.6, maxWidth:560, margin:'0 auto 32px'}}>
              Se você herdou ou construiu uma coleção e deseja vendê-la com curadoria, avaliação transparente e comissão justa, converse com a gente.
            </p>
            <div style={{display:'flex', gap:16, justifyContent:'center', flexWrap:'wrap'}}>
              <a href="contact.html" className="btn btn-gold btn-lg">Falar com o Dr. Sergio</a>
              <a href="tel:+558596553044" className="btn btn-outline btn-lg" style={{color:'var(--gold-500)', borderColor:'var(--gold-700)'}}><Icon name="phone" size={16}/> (85) 9655-3044</a>
            </div>
          </div>
        </section>

        <Footer />
      </>
    );

    ReactDOM.createRoot(document.getElementById('app')).render(<About />);
  </script>
</body>
</html>
