<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazecca Numismática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=11">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png?v=11">
  <link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180.png?v=11">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png?v=11">
  <link rel="shortcut icon" href="assets/favicon-48.png?v=11">
  <style>
    .product-page {
      padding: 32px 0 88px;
    }
    .product-breadcrumb {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 32px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .product-breadcrumb a { color: var(--ink-500); }
    .product-breadcrumb a:hover { color: var(--burgundy-700); }
    .product-breadcrumb .sep { opacity: 0.4; }
    .product-breadcrumb .current { color: var(--ink-800); }

    .product-layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 64px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .product-layout { grid-template-columns: 1fr; gap: 32px; }
    }

    /* Galeria */
    .product-gallery {
      position: sticky;
      top: 140px;
    }
    .gallery-main {
      aspect-ratio: 1;
      background: var(--cream);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .gallery-main::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(201,169,97,0.4);
      border-radius: calc(var(--radius-lg) - 6px);
      pointer-events: none;
    }
    .gallery-main img { width: 82%; height: 82%; object-fit: contain; }
    .gallery-main .zoom-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(31,22,19,0.7);
      color: var(--paper-soft);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .gallery-main .zoom-btn:hover { background: var(--burgundy-900); }
    .gallery-main .face-tag {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--burgundy-900);
      color: var(--gold-500);
      padding: 5px 12px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: var(--radius-full);
    }
    .gallery-thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .gallery-thumb {
      aspect-ratio: 1;
      background: var(--cream);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-thumb.active { border-color: var(--gold-700); }
    .gallery-thumb:hover { border-color: var(--gold-600); }
    .gallery-thumb img { width: 78%; height: 78%; object-fit: contain; }
    .gallery-thumb-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-500);
    }

    /* Detalhes */
    .product-details h1 {
      font-family: var(--font-display);
      font-size: 40px;
      color: var(--burgundy-900);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .product-cat-line {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-800);
      margin-bottom: 8px;
    }
    .product-seals-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0 24px;
    }
    .price-block {
      padding: 20px 0;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 24px;
    }
    .price-block .price {
      font-family: var(--font-display);
      font-size: 42px;
      color: var(--burgundy-900);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .price-block .price-old {
      font-size: 16px;
      color: var(--ink-400);
      text-decoration: line-through;
      margin-left: 12px;
    }
    .price-block .installments {
      margin-top: 8px;
      font-size: 14px;
      color: var(--ink-500);
    }
    .price-block .installments b { color: var(--burgundy-700); font-weight: 500; }
    .price-block .pix-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 12px;
      background: var(--gold-100);
      color: var(--burgundy-800);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
    }

    .buy-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .qty-selector {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper-soft);
    }
    .qty-selector button {
      width: 44px; height: 46px;
      color: var(--ink-700);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .qty-selector input {
      width: 40px;
      height: 46px;
      text-align: center;
      border: 0;
      background: transparent;
      font-weight: 600;
      outline: none;
    }

    /* Ficha técnica */
    .spec-table {
      background: var(--paper-soft);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 32px 0;
    }
    .spec-table h3 {
      background: var(--burgundy-900);
      color: var(--gold-500);
      padding: 14px 20px;
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .spec-table dl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 0;
    }
    .spec-table dt, .spec-table dd {
      padding: 12px 20px;
      border-top: 1px solid var(--line-soft);
      font-size: 14px;
      margin: 0;
    }
    .spec-table dt {
      color: var(--ink-500);
      font-weight: 500;
      background: rgba(0,0,0,0.015);
    }
    .spec-table dd { color: var(--ink-950); font-weight: 500; }

    /* Delivery info */
    .delivery-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }
    .delivery-item {
      padding: 14px 16px;
      background: var(--paper-soft);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .delivery-item .di-icon {
      color: var(--burgundy-700);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .delivery-item .di-title { font-size: 13px; font-weight: 600; color: var(--ink-950); }
    .delivery-item .di-sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }

    /* Tabs */
    .product-tabs {
      margin-top: 88px;
      border-top: 1px solid var(--line-soft);
      padding-top: 48px;
    }
    .tabs-nav {
      display: flex;
      gap: 32px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .tabs-nav button {
      padding: 14px 0;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-500);
      font-weight: 500;
      position: relative;
      transition: color 0.15s;
    }
    .tabs-nav button.active {
      color: var(--burgundy-700);
    }
    .tabs-nav button.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 2px;
      background: var(--gold-700);
    }
    .tab-content {
      max-width: 780px;
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.7;
      color: var(--ink-700);
    }
    .tab-content p + p { margin-top: 20px; }
    .tab-content .story-highlight {
      font-family: var(--font-display);
      font-size: 24px;
      font-style: italic;
      color: var(--burgundy-800);
      margin: 32px 0;
      padding-left: 24px;
      border-left: 2px solid var(--gold-700);
    }

    /* Autenticidade card */
    .auth-card {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--burgundy-800), var(--burgundy-700));
      color: var(--cream);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
    }
    .auth-card .auth-icon {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--gold-700);
      color: var(--burgundy-900);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .auth-card h4 { font-family: var(--font-display); font-size: 20px; color: var(--gold-500); }
    .auth-card p { color: var(--parchment); font-size: 13px; margin-top: 4px; }
    .auth-card .cert-code {
      font-family: var(--font-sans);
      background: rgba(0,0,0,0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--gold-500);
      display: inline-block;
      margin-top: 6px;
    }

    /* Related */
    .related-products {
      margin-top: 88px;
      padding-top: 56px;
      border-top: 1px solid var(--line-soft);
    }
  </style>
</head>
<body>
  <div id="app" data-screen-label="03 Produto"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="js/data.js?v=11"></script>
  <script type="text/babel" src="js/components.jsx?v=11"></script>

  <script type="text/babel">
    const { useState } = React;
    const params = new URLSearchParams(location.search);
    const productId = params.get('id') || 'p001';
    const product = LZ.getProduct(productId) || window.LZ_DATA.products[0];
    const related = window.LZ_DATA.products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
    if (related.length < 4) related.push(...window.LZ_DATA.products.filter(p => p.id !== product.id && !related.find(r => r.id === p.id)).slice(0, 4 - related.length));

    const isCedula = product.category === 'cedulas-br' || product.category === 'cedulas-int';

    const ProductPage = () => {
      const [face, setFace] = useState('anverso');
      const [qty, setQty] = useState(1);
      const [tab, setTab] = useState('description');

      const parcelas = 10;
      const parcela = product.price / parcelas;
      const pixPrice = product.price * 0.95;

      return (
        <>
          <Header page="catalog" />

          <div className="product-page">
            <div className="container">
              <div className="product-breadcrumb">
                <a href="index.html">Início</a>
                <span className="sep">/</span>
                <a href="catalog.html">Catálogo</a>
                <span className="sep">/</span>
                <a href={`catalog.html?cat=${product.category}`}>{product.categoryName}</a>
                <span className="sep">/</span>
                <span className="current">{product.name}</span>
              </div>

              <div className="product-layout">
                <div className="product-gallery">
                  <div className="gallery-main">
                    <span className="face-tag">{isCedula ? (face === 'anverso' ? 'Frente' : 'Verso') : (face === 'anverso' ? 'Anverso' : 'Reverso')}</span>
                    <img src={product.image} alt={product.name} />
                    <button className="zoom-btn" aria-label="Aumentar"><Icon name="zoom-in" size={16}/></button>
                  </div>
                  <div className="gallery-thumbs">
                    <div className={`gallery-thumb ${face === 'anverso' ? 'active' : ''}`} onClick={() => setFace('anverso')}>
                      <img src={product.image}/>
                    </div>
                    <div className={`gallery-thumb ${face === 'reverso' ? 'active' : ''}`} onClick={() => setFace('reverso')} style={{position:'relative'}}>
                      <img src={product.image} style={{transform:'rotateY(180deg)', filter:'brightness(0.92)'}}/>
                    </div>
                    <div className="gallery-thumb"><img src={product.image} style={{opacity:0.9, transform:'rotate(15deg) scale(0.9)'}}/></div>
                    <div className="gallery-thumb"><img src={product.image} style={{opacity:0.9, filter:'sepia(0.3)'}}/></div>
                  </div>
                </div>

                <div className="product-details">
                  <div className="product-cat-line">{product.categoryName} · {product.country} · Ref. {product.referenciaCatalogo || 'LZ'}</div>
                  <h1>{product.name}</h1>

                  {product.figura && (
                    <div style={{marginTop:12, marginBottom:4, fontFamily:'var(--font-serif)', fontSize:17, fontStyle:'italic', color:'var(--ink-500)'}}>
                      Retrato de <b style={{color:'var(--burgundy-700)', fontStyle:'normal'}}>{product.figura}</b>
                      {product.periodo && ` · ${product.periodo}`}
                    </div>
                  )}

                  <div className="product-seals-row">
                    {product.seals && product.seals.includes('rare') && <span className="seal seal-rare"><Icon name="sparkles" size={12}/> {product.rarity}</span>}
                    {product.seals && product.seals.includes('authenticated') && <span className="seal"><Icon name="shield" size={12}/> Autenticada</span>}
                    {product.quantidade > 1 && product.isSequencia && <span className="seal seal-burgundy">Sequência de {product.quantidade}</span>}
                    {product.quantidade > 1 && !product.isSequencia && <span className="seal seal-burgundy">Lote de {product.quantidade}</span>}
                    {product.variedade === 'Autografada' && <span className="seal seal-outline">Autografada</span>}
                    <span className="seal seal-outline">{product.stateShort || product.state}</span>
                  </div>

                  <div className="price-block">
                    <div>
                      <span className="price">{LZ.formatPrice(product.price)}</span>
                      {product.priceOld && <span className="price-old">{LZ.formatPrice(product.priceOld)}</span>}
                    </div>
                    <div className="installments">
                      ou até <b>{parcelas}× de {LZ.formatPrice(parcela)}</b> sem juros no cartão
                    </div>
                    <span className="pix-badge">
                      <Icon name="pix" size={14}/> {LZ.formatPrice(pixPrice)} no PIX (5% off)
                    </span>
                  </div>

                  <div className="buy-actions">
                    <div className="qty-selector">
                      <button onClick={() => setQty(Math.max(1, qty - 1))}><Icon name="minus" size={14}/></button>
                      <input value={qty} readOnly />
                      <button onClick={() => setQty(qty + 1)}><Icon name="plus" size={14}/></button>
                    </div>
                    <button className="btn btn-primary btn-lg" onClick={() => { LZ.addToCart(product.id, qty); location.href='cart.html'; }}>
                      <Icon name="cart" size={16}/> Adicionar ao carrinho
                    </button>
                    <button className="btn btn-ghost btn-lg" title="Favoritar"><Icon name="heart" size={18}/></button>
                  </div>

                  <div className="delivery-block">
                    <div className="delivery-item">
                      <span className="di-icon"><Icon name="truck" size={20}/></span>
                      <div>
                        <div className="di-title">{product.shipping}</div>
                        <div className="di-sub">Envio em 1-2 dias úteis · Rastreado</div>
                      </div>
                    </div>
                    <div className="delivery-item">
                      <span className="di-icon"><Icon name="refresh" size={20}/></span>
                      <div>
                        <div className="di-title">7 dias para trocar</div>
                        <div className="di-sub">Direito de arrependimento</div>
                      </div>
                    </div>
                  </div>

                  <div className="auth-card">
                    <div className="auth-icon"><Icon name="shield" size={28}/></div>
                    <div>
                      <h4>Certificado de Autenticidade</h4>
                      <p>Peça verificada e catalogada pelo Dr. Sergio Costa. Acompanha certificado impresso em papel timbrado.</p>
                      <span className="cert-code">Cert. {product.certificate}</span>
                    </div>
                  </div>

                  <div className="spec-table">
                    <h3>Ficha Técnica</h3>
                    <dl>
                      <dt>Denominação</dt><dd>{product.denomination}</dd>
                      <dt>Ano de Emissão</dt><dd>{product.year > 0 ? product.year : `${Math.abs(product.year)} a.C.`}</dd>
                      {product.padrao && <><dt>Padrão Monetário</dt><dd>{product.padrao}</dd></>}
                      {product.estampa && <><dt>Estampa / Família</dt><dd>{product.estampa}</dd></>}
                      {product.serie && <><dt>Série</dt><dd>{product.serie}</dd></>}
                      {product.assinaturas && <><dt>Assinaturas</dt><dd>{product.assinaturas}</dd></>}
                      {product.variedade && <><dt>Variedade</dt><dd>{product.variedade}</dd></>}
                      <dt>País / Emissão</dt><dd>{product.country}</dd>
                      <dt>Metal / Material</dt><dd>{product.metal}</dd>
                      {product.weight !== '—' && <><dt>Peso</dt><dd>{product.weight}</dd></>}
                      {product.diameter !== '—' && <><dt>Dimensões</dt><dd>{product.diameter}</dd></>}
                      <dt>Estado</dt><dd>{product.stateFull}</dd>
                      {product.defeitos && <><dt>Defeitos observados</dt><dd>{product.defeitos}</dd></>}
                      <dt>Raridade</dt><dd>{product.rarity}</dd>
                      {product.quantidade > 1 && <><dt>Exemplares no lote</dt><dd>{product.quantidade}{product.isSequencia ? ' (em sequência)' : ''}</dd></>}
                      {product.observacoes && <><dt>Observações</dt><dd style={{fontSize: 13}}>{product.observacoes}</dd></>}
                    </dl>
                  </div>
                </div>
              </div>

              {/* Tabs */}
              <div className="product-tabs">
                <div className="tabs-nav">
                  <button className={tab === 'description' ? 'active' : ''} onClick={() => setTab('description')}>{isCedula ? 'Descrição desta Cédula' : 'Descrição da Peça'}</button>
                  <button className={tab === 'history' ? 'active' : ''} onClick={() => setTab('history')}>Contexto Histórico</button>
                  <button className={tab === 'conservation' ? 'active' : ''} onClick={() => setTab('conservation')}>Estado de Conservação</button>
                  <button className={tab === 'shipping' ? 'active' : ''} onClick={() => setTab('shipping')}>Envio e Devolução</button>
                </div>

                <div className="tab-content">
                  {tab === 'description' && (
                    <>
                      <p>{product.description}</p>
                      {product.observacoes && (
                        <div className="story-highlight">
                          <strong style={{display:'block', fontSize:13, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--gold-800)', fontStyle:'normal', marginBottom:8}}>Observação do curador</strong>
                          {product.observacoes}
                        </div>
                      )}
                    </>
                  )}
                  {tab === 'history' && (
                    <>
                      <p>{product.history || 'História completa desta peça em preparação.'}</p>
                      {isCedula && product.figura && (
                        <div className="story-highlight">
                          Retrato: <strong style={{fontStyle:'normal'}}>{product.figura}</strong>
                          {product.periodo && <> · Período: <strong style={{fontStyle:'normal'}}>{product.periodo}</strong></>}
                        </div>
                      )}
                    </>
                  )}
                  {tab === 'conservation' && (
                    <>
                      <p>
                        <b>{product.stateFull}</b>{product.stateLabel ? ` — ${product.stateLabel}` : ''}.
                        {product.defeitos
                          ? ` Neste exemplar registram-se os seguintes vestígios de uso: ${product.defeitos.toLowerCase()}.`
                          : ' Este exemplar não apresenta defeitos aparentes.'}
                      </p>
                      <p>
                        A gradação de {isCedula ? 'cédulas' : 'moedas'} segue os padrões da Sociedade Numismática Brasileira.
                        {isCedula
                          ? ' Para cédulas usamos a escala tradicional FE / SOB / MBC / BC — Flor de Estampa é o grau máximo (praticamente sem circulação).'
                          : ' Para moedas internacionais utilizamos também a escala Sheldon (1-70).'}
                        Todas as peças são fotografadas em alta resolução e você pode solicitar imagens adicionais antes da compra.
                      </p>
                    </>
                  )}
                  {tab === 'shipping' && (
                    <>
                      <p><b>Envio:</b> Enviamos em embalagem sigilosa, acolchoada e com seguro total. Prazo de postagem de 1-2 dias úteis. Frete grátis para todo o Brasil em compras acima de R$ 500.</p>
                      <p><b>Devolução:</b> Você tem 7 dias corridos após o recebimento para devolver a peça, sem justificativa (Código de Defesa do Consumidor). A peça deve retornar em suas condições originais, na embalagem e com o certificado.</p>
                    </>
                  )}
                </div>
              </div>

              {/* Relacionados */}
              <div className="related-products">
                <div className="section-head">
                  <div className="section-title">
                    <span className="eyebrow">Peças semelhantes</span>
                    <h2 className="h2">Continue explorando</h2>
                  </div>
                </div>
                <div className="product-grid">
                  {related.map(p => <ProductCard key={p.id} product={p} />)}
                </div>
              </div>
            </div>
          </div>

          <Footer />
