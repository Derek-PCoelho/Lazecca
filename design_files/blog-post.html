<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazecca Numismática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=11">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png?v=11">
  <link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180.png?v=11">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png?v=11">
  <link rel="shortcut icon" href="assets/favicon-48.png?v=11">
  <style>
    .article-hero {
      background: var(--cream);
      padding: 56px 0 40px;
      text-align: center;
    }
    .article-hero .breadcrumb {
      justify-content: center;
      color: var(--ink-500);
      margin-bottom: 12px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .article-hero .breadcrumb a { color: var(--ink-500); }
    .article-hero .cat {
      display: inline-block;
      padding: 4px 12px;
      background: var(--burgundy-700);
      color: var(--gold-500);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: var(--radius-full);
      margin-bottom: 20px;
    }
    .article-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1.15;
      color: var(--burgundy-900);
      max-width: 820px;
      margin: 0 auto 20px;
    }
    .article-hero .lede {
      max-width: 620px;
      margin: 0 auto;
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--ink-700);
      font-style: italic;
    }
    .article-meta {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 32px;
      font-size: 13px;
      color: var(--ink-500);
      letter-spacing: 0.06em;
    }
    .article-meta .author {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .article-meta .author-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--burgundy-700);
      color: var(--gold-500);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 500;
    }
    .article-meta .author-name { color: var(--ink-800); font-weight: 500; }
    .article-meta .sep { opacity: 0.5; }

    .article-cover {
      max-width: 1100px;
      margin: 0 auto;
      aspect-ratio: 21/9;
      background: var(--cream);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: -40px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
      box-shadow: var(--shadow-lg);
    }
    .article-cover img { width: 100%; height: 100%; object-fit: cover; }

    .article-body {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 24px 80px;
    }
    .article-body p {
      font-family: var(--font-serif);
      font-size: 20px;
      line-height: 1.7;
      color: var(--ink-800);
      margin-bottom: 22px;
    }
    .article-body p.dropcap::first-letter {
      font-family: var(--font-display);
      font-size: 72px;
      float: left;
      line-height: 0.85;
      padding: 6px 12px 0 0;
      color: var(--burgundy-700);
    }
    .article-body h2 {
      font-family: var(--font-display);
      font-size: 30px;
      color: var(--burgundy-900);
      margin: 48px 0 20px;
      line-height: 1.2;
    }
    .article-body h3 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--ink-950);
      margin: 32px 0 12px;
    }
    .article-body blockquote {
      font-family: var(--font-display);
      font-size: 28px;
      font-style: italic;
      color: var(--burgundy-800);
      line-height: 1.4;
      padding: 24px 32px;
      margin: 40px -32px;
      border-left: 3px solid var(--gold-700);
      background: var(--cream);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    @media (max-width: 720px) {
      .article-body blockquote { margin-left: -16px; margin-right: -16px; padding: 16px 20px; font-size: 22px; }
    }
    .article-body figure {
      margin: 40px 0;
    }
    .article-body figure img {
      width: 100%;
      border-radius: var(--radius-md);
    }
    .article-body figcaption {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
      color: var(--ink-500);
      text-align: center;
      margin-top: 12px;
    }
    .article-body ul {
      padding-left: 24px;
      margin-bottom: 24px;
    }
    .article-body ul li {
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.7;
      color: var(--ink-800);
      margin-bottom: 8px;
    }
    .article-body strong { color: var(--burgundy-800); font-weight: 600; }

    .article-share {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 32px 0;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      margin-top: 48px;
    }
    .article-share span { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-500); font-weight: 600; }
    .share-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--ink-700);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .share-btn:hover { background: var(--burgundy-700); color: var(--gold-500); border-color: var(--burgundy-700); }

    .article-author-card {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 24px;
      padding: 32px;
      background: var(--cream);
      border-radius: var(--radius-md);
      margin: 48px auto 0;
      max-width: 720px;
      align-items: center;
    }
    .article-author-card .avatar-lg {
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: var(--paper-soft);
    }
    .article-author-card .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .article-author-card h4 { font-family: var(--font-display); font-size: 22px; color: var(--burgundy-900); }
    .article-author-card p { color: var(--ink-700); font-size: 14px; line-height: 1.6; margin-top: 6px; }

    .related-articles {
      margin-top: 88px;
    }
    .related-articles h2 { font-family: var(--font-display); font-size: 28px; margin-bottom: 32px; text-align: center; color: var(--burgundy-900); }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    @media (max-width: 900px) { .related-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app" data-screen-label="11 Post do Diario"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/blog-contents.js?v=11"></script>
  <script type="text/babel" src="js/components.jsx?v=11"></script>

  <script type="text/babel">
    const posts = window.LZ_DATA.posts;
    const params = new URLSearchParams(location.search);
    const slug = params.get('p') || posts[0].slug;
    const post = posts.find(p => p.slug === slug) || posts[0];
    const related = posts.filter(p => p.slug !== post.slug).slice(0, 3);
    const articleBody = (window.LZ_BLOG_CONTENTS && window.LZ_BLOG_CONTENTS[post.slug])
      || '<p>Conteúdo em preparação.</p>';

    const BlogPost = () => (
      <>
        <Header page="blog" />

        <div className="article-hero">
          <div className="container">
            <div className="breadcrumb"><a href="index.html">Início</a> · <a href="blog.html">Diário</a> · <span>{post.category}</span></div>
            <span className="cat">{post.category}</span>
            <h1>{post.title}</h1>
            <p className="lede">{post.excerpt}</p>
            <div className="article-meta">
              <div className="author">
                <div className="author-avatar">SC</div>
                <span className="author-name">{post.author}</span>
              </div>
              <span className="sep">·</span>
              <span>{post.date}</span>
              <span className="sep">·</span>
              <span>{post.readTime} de leitura</span>
            </div>
          </div>
        </div>

        <div className="container">
          <div className="article-cover"><img src={post.cover} alt={post.title}/></div>
        </div>

        <article className="article-body">
          <div dangerouslySetInnerHTML={{__html: articleBody}} />

          <div className="article-share">
            <span>Compartilhar</span>
            <a href="#" className="share-btn"><Icon name="facebook" size={16}/></a>
            <a href="#" className="share-btn"><Icon name="instagram" size={16}/></a>
            <a href="#" className="share-btn"><Icon name="whatsapp" size={16}/></a>
            <a href="#" className="share-btn"><Icon name="mail" size={16}/></a>
          </div>

          <div className="article-author-card">
            <div className="avatar-lg"><img src="assets/dr-sergio-portrait.png" alt="Dr. Sergio Costa"/></div>
            <div>
              <div style={{fontSize:11, letterSpacing:'0.16em', textTransform:'uppercase', color:'var(--ink-500)', marginBottom:4}}>Escrito por</div>
              <h4>Dr. Sergio Costa</h4>
              <p>Curador-chefe da La Zecca. Doutor em História Econômica pela USP. Colecionador desde 1985, quando ganhou a primeira moeda do avô — um 100 Réis de 1918 que ainda guarda.</p>
            </div>
          </div>
        </article>

        {/* Related */}
        <div className="container">
          <div className="related-articles">
            <h2>Continue lendo</h2>
            <div className="related-grid">
              {related.map(p => (
                <a key={p.slug} href={`blog-post.html?p=${p.slug}`} className="blog-card" style={{display:'flex', flexDirection:'column'}}>
                  <div style={{aspectRatio:'16/10', overflow:'hidden', background:'var(--cream)', borderRadius:'var(--radius-md)', marginBottom:16}}>
                    <img src={p.cover} alt={p.title} style={{width:'100%', height:'100%', objectFit:'cover'}}/>
                  </div>
                  <div style={{fontSize:11, letterSpacing:'0.18em', textTransform:'uppercase', color:'var(--gold-800)', marginBottom:8}}>{p.category}</div>
                  <h3 style={{fontFamily:'var(--font-display)', fontSize:20, color:'var(--ink-950)', marginBottom:8, lineHeight:1.25}}>{p.title}</h3>
                  <p style={{color:'var(--ink-500)', fontSize:14, lineHeight:1.6}}>{p.excerpt}</p>
                </a>
              ))}
            </div>
          </div>
        </div>

        <Footer />
      </>
    );

    ReactDOM.createRoot(document.getElementById('app')).render(<BlogPost />);
  </script>
</body>
</html>
